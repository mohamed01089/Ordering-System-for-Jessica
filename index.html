<html>
    <head>
        <title>Ordering System for Jessica</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="index.html">Menu</a></li>
                <li><a href="orders.html">Orders</a></li>
            </ul>
        </nav>
        <div id="menu">
            <h1 id="section">Menu</h1>
            <div id="menu_row">
                <div id="menu_col">
                    <h2>Hot</h2>
                    <div class="box">
                        <div id="image">
                            <img src="images/black_coffee.jpg" alt="">
                        </div>
                        <div>
                            <h3>Black Coffee</h3>
                            <h4>5$</h4>
                        <div class="button">
                            <button class="add-to-cart" data-id="1" data-name="Black Coffee" data-price="5">Add to Cart</button>
                        </div>
                        </div>
                        <div id="image">
                            <img src="images/cappuccino.jpg" alt="">
                        </div>
                        <div>
                            <h3>Cappuccino</h3>
                            <h4>7$</h4>
                        <div class="button">
                            <button class="add-to-cart" data-id="2" data-name="Cappuccino" data-price="7">Add to Cart</button>
                        </div>
                        </div>
                        <div id="image">
                            <img src="images/hot_chocolate.jpg" alt="">
                        </div>
                        <div>
                            <h3>Hot Chocolate</h3>
                            <h4>10$</h4>
                        <div class="button">
                            <button class="add-to-cart" data-id="3" data-name="Hot Chocolate" data-price="10">Add to Cart</button>
                        </div>
                        </div>
                    </div>
                </div>
                <div id="menu_col">
                    <h2>Cold</h2>
                <div class="box">
                    <div id="image">
                        <img src="images/iced_coffee.jpg" alt="">
                    </div>
                    <div>
                        <h3>Iced Coffee</h3>
                        <h4>7$</h4>
                        <div class="button">
                            <button class="add-to-cart" data-id="4" data-name="Iced Coffee" data-price="7">Add to Cart</button>
                        </div>
                    </div>
                    <div id="image">
                        <img src="images/coffee_ice_cream_frappe.jpg" alt="">
                    </div>
                    <div>
                        <h3>Coffee Ice Cream Frappe</h3>
                        <h4>15$</h4>
                        <div class="button">
                            <button class="add-to-cart" data-id="5" data-name="Coffee Ice Cream Frappe" data-price="15">Add to Cart</button>
                        </div>
                    </div>
                    <div id="image">
                        <img src="images/lemon_iced_tea.jpg" alt="">
                    </div>
                    <div>
                        <h3>Lemon Iced Tea</h3>
                        <h4>6$</h4>
                        <div class="button">
                            <button class="add-to-cart" data-id="6" data-name="Lemon Iced Tea" data-price="6">Add to Cart</button>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
        <div class="cart-slidebar">
            <div class="cart-header">
                <h2>Coffee Cart</h2>
                <button class="close-cart">&times;</button>
            </div>
            <ul class="cart-items"></ul>
            <div class="cart-total">
                <strong>Total: $<span id="total">0.00</span></strong>
            </div>
            <button id="buy" onclick="checkout()">Proceed to checkout</button>
        </div>
        <script src="script.js"></script>
        <button id="open-cart" onclick="openCart()">View Cart</button>
    </body>
</html>
